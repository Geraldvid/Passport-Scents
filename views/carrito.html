<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito Passport Scents</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="..//res/css/stylesC.css">
</head>
<body class="container py-5">

  <h2 class="text-gold fw-bold mb-4">🧾 Tu Pedido</h2>

  <!-- Carrito -->
  <div id="carrito" class="bg-dark p-4 rounded border border-gold">
    <div id="itemsCarrito"></div>
    <hr class="border-gold">
    <div class="d-flex justify-content-between align-items-center">
      <span class="fw-bold">Total:</span>
      <span id="totalCarrito" class="text-gold fw-bold">₡0</span>
    </div>
  </div>

  <!-- Botones -->
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-secondary w-50" onclick="volverCatalogo()">⬅️ Volver al Catálogo</button>
    <button class="btn btn-gold w-50" onclick="toggleFormulario()">📝 Información del Cliente</button>
    <button class="btn btn-secondary w-50" onclick="descargarFactura()">
  📥 Descargar Factura
</button>

  </div>

  <!-- Formulario del cliente (oculto al inicio) -->
  <div id="formularioCliente" class="formulario-cliente d-none">
    <h5 class="text-gold fw-bold mb-3">Información del Cliente</h5>
    <div class="mb-2">
      <label class="form-label">Nombre completo:</label>
      <input type="text" id="nombreCliente" class="form-control">
    </div>
    <div class="mb-2">
      <label class="form-label">Cédula:</label>
      <input type="text" id="cedulaCliente" class="form-control">
    </div>
    <div class="mb-2">
      <label class="form-label">Teléfono:</label>
      <input type="tel" id="telefonoCliente" class="form-control">
    </div>
    <div class="mb-2">
      <label class="form-label">Provincia:</label>
      <input type="text" id="provinciaCliente" class="form-control">
    </div>
    <div class="mb-2">
      <label class="form-label">Cantón:</label>
      <input type="text" id="cantonCliente" class="form-control">
    </div>
    <div class="mb-2">
      <label class="form-label">Distrito:</label>
      <input type="text" id="distritoCliente" class="form-control">
    </div>
     <div class="mb-2">
      <label class="form-label">Dirección de entrega:</label>
      <input type="text" id="entregaCliente" class="form-control">
    </div>
    
  </div>

  <button class="btn btn-gold w-100 mt-4" onclick="enviarPorWhatsApp()">📤 Enviar Pedido por WhatsApp</button>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="..//res/js/carrito.js"></script>
</body>
</html>
